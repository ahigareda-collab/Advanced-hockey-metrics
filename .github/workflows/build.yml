name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Unzip project
        run: for f in *.zip; do unzip -o "$f"; done
      - name: Test and build
        working-directory: AdvancedMetrics
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: AdvancedMetrics-apk
          path: AdvancedMetrics/app/build/outputs/apk/release/app-release.apk
